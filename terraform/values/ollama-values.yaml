# Ollama Helm Chart Values
# Managed by Terraform — chart v1.54.0+

image:
  repository: ollama/ollama
  tag: 0.40.6
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 11434

resources:
  requests:
    memory: 4Gi
    cpu: 500m
  limits:
    memory: 40Gi
    cpu: 4000m

# Persistent storage so models survive pod restarts
# Uses the existing PVC created by the previous chart version.
# This avoids the "spec is immutable" error on upgrade.
persistentVolume:
  enabled: true
  existingClaim: "ollama"

ollama:
  # Pull models on container startup (persisted, so only downloads once)
  models:
    pull:
          - qwen3.5:4b

# Environment variables
extraEnv:
  - name: OLLAMA_HOST
    value: "0.0.0.0:11434"
  - name: OLLAMA_DEBUG
    value: "0"
  - name: GIN_MODE
    value: "release"

livenessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 6
